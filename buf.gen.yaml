version: v2
clean: true
inputs:
  - module: buf.build/bannote/token-service
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/gsc-lab/cs25-1-bannote-api-gateway/gen/go
plugins:
  # Go plugins
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative